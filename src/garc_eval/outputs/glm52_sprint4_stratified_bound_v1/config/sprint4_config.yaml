experiment: glm52_sprint4_stratified_bound_v1
date_utc: "2026-06-26"
budgets: [30, 40, 60, 80, 100, 150]
fine_grid_b80: [70, 72, 74, 75, 76, 78, 80, 82, 84, 85, 86, 88, 90]
proxy_score: object_count_mean
proxy_pool_multiplier: 2.0
alpha: 0.15
audit_frac: 0.10
stage20_repeats: 200
stage21_repeats: 500
deltas: [0.05, 0.10]
block_size_seconds: 300
stratified_bound:
  correction: bonferroni
  delta_h: delta / number_of_blocks
  allocations:
    - proportional
    - neyman_oracle_informed_diagnostic_only
randomness:
  stage20_seeds: "0..199"
  stage21_seed_formula: "sim + budget * 10000 + int(delta * 1000000)"
