    status: complete
    priority: medium
    type: experiment
    requires_gpu: false
    requires_vlm: false
    requires_yolo: false
    notes: "COMPLETE. Three modes compared via strict-replay LOSO: globalcap (current c2, always generate zp arms), soft_gate (zp_share>=0.40, >=6 zp bins, n_probe>=2 with 0 positives OR negative_streak>=2), strict_gate (zp_share>=0.50, >=8 zp bins, n_probe>=3, n_pos==0). Result: soft_gate drops d3_0_1200 recall to 0.000 (from 0.167), strict_gate same. Both gates open too late — 2-4 zp calls vs 12-13 needed for VDC to hit positives. realcartest 0 regressions across all modes (zp arms never fire there regardless). Conclusion: GBM policy is its own effective gate; hard gating harms exploration. Keep globalcap as ECP-c2 mechanism. Outputs: t028e_nodegate_frontier.csv, t028e_nodegate_action_usage.csv, t028e_nodegate_report.md."
    success_criteria: "Both gates regress vs globalcap on d3_0_1200. globalcap confirmed best. DONE."
