  - id: T024
    title: HTS-Discover (Phase 1) targeted spec — hierarchical tree search for sparse segments
    status: pending
    priority: medium
    type: design_followup
    requires_gpu: false
    requires_vlm: false
    requires_yolo: false
    notes: "Design-only next step from hts_aqp_phase0_feasibility (Verdict B = weakly feasible / segment-dependent). Phase 0 data: at b=4, savings vs flat scan on dataset3 segments = 21-59pct; HTS finds all 6-12 events in 49-95 calls vs existing best 1-2 events in 12-24 calls. Phase 0 is God's-eye upper bound; real algorithm's ratio >= Phase 0 ratio. Required design items: (1) b=4 as default with b in {2,4,8} sensitivity; (2) hybrid fallback for high-density (>20pct positive) segments — realcartest_2000_3200 b=2 shows -21pct regression vs flat scan due to coarse-positive saturation; (3) Phase 0 call counts as efficiency lower bound for the real Beta+UCB algorithm; (4) CERTIFY integration deferred to Phase 2; (5) Coverage convention for evaluation must be IoU>=0.3 (per run_eventlift_full_benchmark_v1.py) — Phase 0's any-overlap convention is diagnostic-only and cannot be used for the Phase 1 evaluation. coarse-to-fine is not a novel search paradigm (standard in spatial/temporal/game-tree search); the candidate-novel element is the application to event-level AQP. Not a SOTA claim, no safe stopping claim. Coarse-oracle-VLM-reliability assumption (validation needs not just strict-replay OR aggregation but real VLM coarse-window judgment) flagged for future work."
    blocker: "Requires explicit human authorization. Default selector (score_topk + temporal NMS + duration cap) must NOT be replaced by HTS."
