  - id: T028e-diagnostics
    title: ECP Step 4e diagnostics — ceiling clarification (static vs closed-loop oracle)
    status: complete
    priority: high
    type: experiment
    requires_gpu: false
    requires_vlm: false
    requires_yolo: false
    notes: "COMPLETE. Resolved c2 > ceiling paradox on dataset3_0_1200. Root cause: marginal_utility assigns u=0.02 to all negatives, safety override (best_u <= 0.02) always falls back to DISCOVER, creating an inescapable DISCOVER-only loop. Closed-loop oracle (remove safety override, +0.04 exploration bonus for zp arms when zp_share >= 0.30) achieves 0.167 = c2, confirming the issue is MYOPIC utility + safety override, not fundamental ceiling. Also reveals headroom: closed-loop ceiling 0.167 on d3_1200_2400 vs c2 0.083, and 0.222 on d3_2400_3462 @0.30 vs c2 0.111. Diagnostics: per-candidate trace table (22248 rows), arm utility summary, zero-proxy hits table. Outputs: t028e_candidate_table.csv, t028e_arm_utility_summary.csv, t028e_zero_proxy_hits.csv, t028e_diagnostics_frontier.csv, t028e_diagnostics_report.md."
    success_criteria: "Paradox resolved; closed-loop oracle consistently >= c2. DONE."
  - id: T028e-nodegate
