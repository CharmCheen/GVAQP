    status: active
    priority: highest
    type: design_followup
    requires_gpu: false
    requires_vlm: false
    requires_yolo: false
    notes: "Highest-priority mainline, reformulated 2026-07-07. The bottleneck is NOT proxy accuracy; it is absence of an event-level budgeted decision policy under weak proxy / expensive oracle / unknown boundaries. EC-AQP's event-coverage-mass objective is absorbed as the reward term inside ECP. Design doc: outputs/ecp_event_coverage_policy_v1/ECP_DESIGN.md. ECP unifies DISCOVER + ROBUST_PROBE + BRIDGE + CERTIFY + ZERO_PROXY as event-level arms of a contextual bandit; HTS-EC / EventLift-DC are candidate executors. Default selector (score_topk + temporal NMS + duration cap) and Core/Halo release unchanged. Do not run another D1/D2/D3 sweep (already failed to beat B7-core on B_90/90)."
    success_criteria: "ECP design doc that (a) declares event-level state/arms/reward, (b) states the 4-step validation plan (AnchorBridge shadow -> action-utility labeling -> hand-designed bandit -> offline learned policy), (c) depends on no new VLM/annotation round, (d) names the smallest strict-replay eval that would falsify it."
