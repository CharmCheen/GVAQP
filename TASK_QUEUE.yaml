  - id: T028c
    title: ECP Step 4c — candidate ceiling + event-utility ranking policy
    status: complete
    priority: medium
    type: experiment
    requires_gpu: false
    requires_vlm: false
    requires_yolo: false
    notes: "COMPLETE (T028c-0 + T028c-1). T028c-0 oracle ceiling: learnable event-level signal EXISTS on proxy-informative realcartest (ceiling +0.10..+0.14 over v2 on the cells v2 regressed on) but NOT on proxy-zero dataset3_0_1200/1200_2400 (candidate generator cannot propose zero-proxy positives -> ceiling≈0 there). T028c-1 event-utility ranker (GradientBoosting on u(arm|state,arm) from the candidate-level utility table, NOT logger-confined) runs strict-replay and RECOVERS the ceiling on collapsed cells: realcartest_3200_3830 @0.30 c1 0.286=ceiling beats v2 0.143; realcartest_0_1570 @0.30 c1 0.250 vs v2 0.200; dataset3_2400_3462 c1 0.111>v2 0.000. First ECP variant to beat v2 on realcartest, no precision loss. Proxy-zero dataset3 still blocked at candidate-generator level. T028d deferred. Outputs: ecp_candidate_utility_by_step.csv, ecp_oracle_ceiling_frontier.csv, t028c0_ceiling_report.md, t028c1_event_utility_policy_*.csv/.md, ECP_STEP4C_SYNTHESIS.md."
    success_criteria: "T028c-0 ceiling validates learnable signal; T028c-1 strict-replay policy beats v2 on realcartest. DONE."
