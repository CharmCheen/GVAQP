<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Human Event Continuity</title><style>body{font-family:system-ui,sans-serif;max-width:950px;margin:22px auto;padding:0 14px;color:#18212b}video{width:100%;max-height:530px;background:#111;margin:8px 0}.panel{background:#f4f7fb;padding:14px;border-radius:8px;white-space:pre-wrap}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}button{font-size:18px;padding:16px;border-radius:8px;border:1px solid #8ba0b5;background:white;cursor:pointer}button:hover{background:#e8f2ff}#note{width:100%;min-height:58px}small{color:#51606e}.hidden{display:none}</style></head><body><h1>Event-continuity annotation</h1><div id="progress"></div><div class="panel" id="query"></div><div id="videos"></div><p><b>Question:</b> Considering A, the intervening video, and B, what is the best judgment?</p><div class="choices"><button data-label="SAME_EVENT">1 — SAME EVENT</button><button data-label="DIFFERENT_EVENTS">2 — DIFFERENT EVENTS</button><button data-label="ANCHOR_INVALID">3 — ANCHOR INVALID</button><button data-label="UNCERTAIN">4 — UNCERTAIN</button></div><label>Optional comment (not required)<textarea id="note"></textarea></label><p><button id="prev">← Previous</button> <button id="next">Next →</button> <small>Keyboard: 1/2/3/4 label; left/right navigate.</small></p><p id="status"></p><script src="app.js"></script></body></html>
